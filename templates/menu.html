{% extends "base.html" %}
{% block content %}
<h2>🍲 Menu Management (CRUD)</h2>
<div class="row">
    <div class="col-md-8">
        <table class="table table-bordered bg-white">
            <thead class="table-dark"><tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th></tr></thead>
            <tbody>
                {% for item in menu_items %}
                <tr><td>{{ item[0] }}</td><td>{{ item[1] }}</td><td>{{ item[2] }}</td><td>${{ "%.2f"|format(item[3]) }}</td><td>{{ item[4] }}</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <div class="col-md-4">
        <div class="card p-3">
            <h4>Add New Dish</h4>
            <form method="POST">
                <div class="mb-2"><label>Dish Name</label><input type="text" name="name" class="form-control" required></div>
                <div class="mb-2"><label>Category</label><select name="category" class="form-select"><option>Main Course</option><option>Appetizer</option><option>Dessert</option><option>Beverages</option></select></div>
                <div class="mb-2"><label>Price ($)</label><input type="number" step="0.01" name="price" class="form-control" required></div>
                <div class="mb-3"><label>Stock</label><input type="number" name="stock" class="form-control" required></div>
                <button type="submit" class="btn btn-success w-100">Add Item</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
