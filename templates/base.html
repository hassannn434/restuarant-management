<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RestoFlow Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% if session.get('username') %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
        <a class="navbar-brand" href="/pos">🍽️ RestoFlow</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/pos">POS & Billing</a></li>
                <li class="nav-item"><a class="nav-link" href="/kitchen">Table Status</a></li>
                {% if session.get('role') == 'Admin' %}
                <li class="nav-item"><a class="nav-link" href="/menu">Menu CRUD</a></li>
                <li class="nav-item"><a class="nav-link" href="/analytics">Analytics</a></li>
                {% endif %}
            </ul>
            <span class="navbar-text text-white me-3">User: {{ session.get('username') }} ({{ session.get('role') }})</span>
            <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>
        </div>
    </nav>
    {% endif %}
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
